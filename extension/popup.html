<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blooket Cyber Assistant</title>
  <style>
    body { width: 260px; margin: 0; padding: 18px; font: 14px system-ui, sans-serif; background: #17213b; color: #fff; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { line-height: 1.4; color: #cbd7f0; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 11px; font: inherit; font-weight: 700; cursor: pointer; background: #45c9cc; color: #09152b; }
    .status { font-weight: 700; }
    kbd { border: 1px solid #8da1c9; border-radius: 4px; padding: 1px 5px; }
  </style>
</head>
<body>
  <h1>Blooket Cyber Assistant</h1>
  <p class="status" id="status">Checking status…</p>
  <button id="toggle" type="button">Toggle panel</button>
  <p>On a Cyber Hack tab, press <kbd>O</kbd> to turn the panel off or on. Changing state stops or starts the assistant without reloading your game.</p>
  <script src="popup.js"></script>
</body>
</html>
